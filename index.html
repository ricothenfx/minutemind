<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="dark light" />
    <script>
      (function () {
        try {
          var stored = localStorage.getItem("minutemind-theme");
          var light = stored
            ? stored === "light"
            : window.matchMedia("(prefers-color-scheme: light)").matches;
          if (light) {
            document.documentElement.classList.add("light");
            document.documentElement.style.colorScheme = "light";
            document.documentElement.style.background = "#f5f5fa";
          }
        } catch (e) {}
      })();
    </script>
    <meta
      name="description"
      content="MinuteMind turns messy meeting transcripts into decisions, action items and a ready-to-send follow-up email — every claim grounded in an exact quote."
    />
    <meta name="theme-color" content="#050507" />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="MinuteMind" />
    <meta property="og:title" content="MinuteMind — AI Meeting Intelligence" />
    <meta
      property="og:description"
      content="Paste a messy transcript, get decisions, action items and a follow-up email — every claim grounded in an exact quote. AI extracts. You verify."
    />
    <meta property="og:url" content="https://minutemind.ricothen.com" />
    <meta property="og:image" content="https://minutemind.ricothen.com/og-image.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="MinuteMind — AI Meeting Intelligence" />
    <meta
      name="twitter:description"
      content="Paste a messy transcript, get decisions, action items and a follow-up email — every claim grounded in an exact quote. AI extracts. You verify."
    />
    <meta name="twitter:image" content="https://minutemind.ricothen.com/og-image.png" />
    <title>MinuteMind — AI Meeting Intelligence</title>
  </head>
  <body style="background: #050507">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
